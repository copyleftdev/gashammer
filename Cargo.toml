[workspace]
resolver = "2"
members = [
    "crates/gashammer-common",
    "crates/gashammer-nitro",
    "crates/gashammer-edge",
    "crates/gashammer-hive",
    "crates/gashammer-workload",
    "crates/gashammer-telemetry",
    "crates/gashammer-oracle",
    "crates/gashammer-fault",
    "crates/gashammer-report",
    "crates/gashammer-scenario",
    "crates/gashammer-docgen",
    "crates/gashammer-testenv",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75.0"
license = "BSL-1.1"
repository = "https://github.com/copyleftdev/gashammer"
authors = ["Don Johnson <copyleftdev@github.com>"]

[workspace.dependencies]
axum = { version = "0.7", features = ["json"] }
thiserror = "2"
serde = { version = "=1.0.217", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
proptest = "1"
alloy = { version = "0.12", features = ["provider-http", "rpc-types", "signers", "signer-local", "consensus", "network"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"
reqwest = { version = "0.12", features = ["json"] }
testcontainers = "0.23"
tower = "0.4"
url = "2"

# Workspace crates
gashammer-common = { path = "crates/gashammer-common" }
gashammer-nitro = { path = "crates/gashammer-nitro" }
gashammer-edge = { path = "crates/gashammer-edge" }
gashammer-hive = { path = "crates/gashammer-hive" }
gashammer-workload = { path = "crates/gashammer-workload" }
gashammer-telemetry = { path = "crates/gashammer-telemetry" }
gashammer-oracle = { path = "crates/gashammer-oracle" }
gashammer-fault = { path = "crates/gashammer-fault" }
gashammer-report = { path = "crates/gashammer-report" }
gashammer-scenario = { path = "crates/gashammer-scenario" }
gashammer-docgen = { path = "crates/gashammer-docgen" }
gashammer-testenv = { path = "crates/gashammer-testenv" }
