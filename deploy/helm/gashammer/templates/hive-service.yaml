apiVersion: v1
kind: Service
metadata:
  name: {{ include "gashammer.fullname" . }}-hive
  labels:
    {{- include "gashammer.hive.labels" . | nindent 4 }}
spec:
  type: {{ .Values.hive.service.type }}
  ports:
    - name: rest
      port: {{ .Values.hive.service.restPort }}
      targetPort: rest
      protocol: TCP
    - name: grpc
      port: {{ .Values.hive.service.grpcPort }}
      targetPort: grpc
      protocol: TCP
    - name: metrics
      port: {{ .Values.hive.config.telemetry.prometheus_port }}
      targetPort: metrics
      protocol: TCP
  selector:
    {{- include "gashammer.hive.selectorLabels" . | nindent 4 }}
